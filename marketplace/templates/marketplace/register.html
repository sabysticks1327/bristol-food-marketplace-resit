{% extends "marketplace/base.html" %}

{% block content %}
  <section class="panel">
    <h1>{{ account_type }} Registration</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<p class="helptext">{{ field.help_text }}</p>{% endif %}
        {{ field.errors }}
      {% endfor %}
      <div class="actions">
        <button type="submit">Create {{ account_type|lower }} account</button>
      </div>
    </form>
  </section>
{% endblock %}
