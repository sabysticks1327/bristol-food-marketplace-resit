{% extends "marketplace/base.html" %}

{% block content %}
  <section class="panel">
    <h1>Log In</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      {% endfor %}
      <div class="actions">
        <button type="submit">Log in</button>
      </div>
    </form>
  </section>
{% endblock %}
