services:
  web:
    build: .
    container_name: bristol_marketplace_web
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      SECRET_KEY: "dev-compose-key-change-before-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      DB_ENGINE: "postgres"
      POSTGRES_DB: "bristol_marketplace"
      POSTGRES_USER: "bristol"
      POSTGRES_PASSWORD: "bristol"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "bristol_marketplace"
      POSTGRES_USER: "bristol"
      POSTGRES_PASSWORD: "bristol"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bristol -d bristol_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
